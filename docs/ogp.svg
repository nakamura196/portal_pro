<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c30"/>
      <stop offset="55%" stop-color="#04385f"/>
      <stop offset="100%" stop-color="#0b8bee"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative grid of demo cards -->
  <g transform="translate(700, 90)">
    <g opacity="0.9">
      <rect x="0" y="0" width="140" height="100" rx="10" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="160" y="0" width="140" height="100" rx="10" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="320" y="0" width="140" height="100" rx="10" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

      <rect x="0" y="120" width="140" height="100" rx="10" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="160" y="120" width="140" height="100" rx="10" fill="#ffcd00" fill-opacity="0.25" stroke="#ffcd00" stroke-opacity="0.6" stroke-width="2"/>
      <rect x="320" y="120" width="140" height="100" rx="10" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

      <rect x="0" y="240" width="140" height="100" rx="10" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="160" y="240" width="140" height="100" rx="10" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="320" y="240" width="140" height="100" rx="10" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

      <rect x="0" y="360" width="140" height="100" rx="10" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="160" y="360" width="140" height="100" rx="10" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="320" y="360" width="140" height="100" rx="10" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    </g>
  </g>

  <!-- title block -->
  <g transform="translate(80, 200)" fill="#ffffff" font-family="'Noto Serif JP', 'Hiragino Mincho ProN', serif">
    <text x="0" y="0" font-size="56" font-weight="700" letter-spacing="-1">UTokyo Digital</text>
    <text x="0" y="68" font-size="56" font-weight="700" letter-spacing="-1">Archive Portal Apps</text>
  </g>
  <g transform="translate(80, 320)" fill="#cee8fc" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif">
    <text x="0" y="0" font-size="22" font-weight="400">東京大学デジタルアーカイブポータルの</text>
    <text x="0" y="34" font-size="22" font-weight="400">活用例 (IIIF / 可視化 / 3D / AR / WebGL)</text>
  </g>

  <g transform="translate(80, 510)" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif">
    <rect x="0" y="-30" width="16" height="16" rx="3" fill="#ffcd00"/>
    <text x="28" y="-16" font-size="20" font-weight="500" fill="#ffffff" opacity="0.9">nakamura196.github.io/portal_pro</text>
  </g>
</svg>
