<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>東京大学の名称 (年表) | UTokyo Digital Archive Portal Apps</title>
    <meta name="description" content="開成学校から現在の東京大学まで、5期にわたる名称の変遷を年表で表示します。" />
    <meta name="theme-color" content="#0b8bee" />
    <link rel="canonical" href="https://nakamura196.github.io/portal_pro/timeline.html" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UTokyo Digital Archive Portal Apps" />
    <meta property="og:title" content="東京大学の名称 (年表) | UTokyo Digital Archive Portal Apps" />
    <meta property="og:description" content="開成学校から現在の東京大学まで、5期にわたる名称の変遷を年表で表示します。" />
    <meta property="og:url" content="https://nakamura196.github.io/portal_pro/timeline.html" />
    <meta property="og:image" content="https://nakamura196.github.io/portal_pro/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/nakamura196/react-ui@v0.4.0/src/styles/static.css"
    />

    <style>
      .tl-track {
        position: relative;
        height: 64px;
        margin: 2rem 0 1.5rem;
        background: var(--ds-surface);
        border: 1px solid var(--ds-border);
        border-radius: 999px;
        overflow: visible;
      }
      .tl-bar {
        position: absolute;
        top: 8px;
        bottom: 8px;
        background: linear-gradient(135deg, #04385f 0%, #0b8bee 100%);
        border-radius: 999px;
        color: #fff;
        font-family: var(--ds-font-serif);
        font-size: 0.85rem;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 0.5rem;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        cursor: default;
        transition: transform 0.15s ease;
      }
      .tl-bar:hover { transform: translateY(-2px); }
      .tl-bar.is-current { background: linear-gradient(135deg, #096fbe 0%, #ffcd00 100%); color: #04385f; font-weight: 700; }

      .tl-axis {
        position: relative;
        margin-bottom: 1rem;
        height: 24px;
        font-size: 0.75rem;
        color: var(--ds-fg-muted);
      }
      .tl-axis__tick {
        position: absolute;
        transform: translateX(-50%);
        white-space: nowrap;
        padding-top: 4px;
        border-left: 1px solid var(--ds-border);
        height: 20px;
      }
      .tl-axis__tick > span {
        position: absolute;
        top: 6px;
        left: 4px;
      }

      .tl-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 0.75rem;
        margin-top: 2rem;
      }
      .tl-item {
        background: var(--ds-surface);
        border: 1px solid var(--ds-border);
        border-radius: var(--ds-radius, 0.5rem);
        padding: 1rem;
      }
      .tl-item__period {
        font-size: 0.8rem;
        color: var(--ds-fg-muted);
        margin: 0 0 0.25rem;
        font-family: var(--ds-font-sans);
      }
      .tl-item__name {
        font-family: var(--ds-font-serif);
        font-weight: 600;
        font-size: 1.1rem;
        margin: 0 0 0.25rem;
        color: var(--ds-fg);
      }
      .tl-item__duration {
        font-size: 0.8rem;
        color: var(--ds-primary);
        font-weight: 500;
      }
      .tl-item.is-current { border-color: var(--ds-accent); }
      .tl-item.is-current .tl-item__name::after {
        content: "現在";
        font-size: 0.7rem;
        padding: 0.1rem 0.4rem;
        background: var(--ds-accent);
        color: #04385f;
        border-radius: 999px;
        margin-left: 0.5rem;
        font-weight: 700;
        vertical-align: middle;
      }
      :root.dark .tl-item.is-current .tl-item__name::after,
      :root:not(.light) .tl-item.is-current .tl-item__name::after { color: #04385f; }
    </style>
  </head>
  <body>
    <header class="ds-header">
      <div class="ds-header__inner">
        <a class="ds-header__brand" href="./">UTokyo Digital Archive Portal Apps</a>
        <nav class="ds-header__nav">
          <a class="ds-header__nav-link" href="./">Home</a>
          <a class="ds-header__nav-link" href="https://github.com/nakamura196/portal_pro" target="_blank" rel="noopener">GitHub</a>
        </nav>
      </div>
    </header>

    <main class="ds-container ds-section">
      <h1 class="ds-h1">東京大学の名称 (年表)</h1>
      <p class="ds-lead">
        1868年の開成学校から現在の東京大学まで、5期にわたる名称の変遷を年表で表示します。データは <a href="./data/timeline.json">data/timeline.json</a> (静的) を読み込みます。
      </p>

      <section class="ds-card" aria-labelledby="tl-heading">
        <h2 id="tl-heading" class="ds-card__title">年表</h2>
        <div id="tl-axis" class="tl-axis" aria-hidden="true"></div>
        <div id="tl-track" class="tl-track" role="list" aria-label="名称の変遷"></div>
        <div id="tl-list" class="tl-list"></div>
      </section>
    </main>

    <footer class="ds-footer">
      <div class="ds-footer__inner">
        <div class="ds-footer__grid">
          <div>
            <p class="ds-footer__brand">UTokyo Digital Archive Portal Apps</p>
            <p class="ds-footer__brand-desc">東京大学デジタルアーカイブポータルAPIの活用例集。</p>
          </div>
          <div class="ds-footer__col">
            <h2 class="ds-footer__heading">関連リンク</h2>
            <ul class="ds-footer__list">
              <li><a class="ds-footer__link" href="./">Home</a></li>
              <li><a class="ds-footer__link" href="https://github.com/nakamura196/portal_pro" target="_blank" rel="noopener">GitHub</a></li>
              <li><a class="ds-footer__link" href="https://nakamura196.github.io/portfolio/" target="_blank" rel="noopener noreferrer">nakamura196 の他のツール</a></li>
            </ul>
          </div>
        </div>
        <div class="ds-footer__copyright">© 2019–2026 nakamura196 · CC BY 4.0</div>
      </div>
    </footer>

    <script>
      const ICAL = "http://www.w3.org/2002/12/cal/icaltzd#";

      function parseDate(s) {
        if (!s) return null;
        const parts = s.split("-").map(Number);
        return { year: parts[0], month: parts[1] || 1, day: parts[2] || 1 };
      }

      function dateToFloat(d) {
        if (!d) return null;
        return d.year + (d.month - 1) / 12 + (d.day - 1) / 365;
      }

      function formatDate(s) {
        const d = parseDate(s);
        if (!d) return "?";
        if (!s.includes("-")) return d.year + "年";
        const parts = s.split("-");
        if (parts.length === 2) return d.year + "年" + d.month + "月";
        return d.year + "年" + d.month + "月" + d.day + "日";
      }

      function durationYears(start, end) {
        if (!start || !end) return null;
        return Math.max(0, dateToFloat(end) - dateToFloat(start));
      }

      function fmtDuration(years) {
        if (years == null) return "";
        if (years < 1) return Math.round(years * 12) + "ヶ月";
        const y = Math.floor(years);
        const m = Math.round((years - y) * 12);
        return y + "年" + (m > 0 ? m + "ヶ月" : "");
      }

      async function init() {
        const res = await fetch("./data/timeline.json");
        const rows = await res.json();

        const items = rows
          .filter((r) => r[ICAL + "summary"])
          .map((r) => ({
            id: r["@id"],
            order: (r["http://ndl.go.jp/dcndl/terms/localCallNumber"] || [{}])[0]["@value"] || 0,
            summary: r[ICAL + "summary"][0]["@value"],
            start: r[ICAL + "dtstart"][0]["@value"],
            end: r[ICAL + "dtend"][0]["@value"],
          }))
          .sort((a, b) => Number(a.order) - Number(b.order));

        const minF = Math.min(...items.map((i) => dateToFloat(parseDate(i.start))));
        const maxF = Math.max(...items.map((i) => dateToFloat(parseDate(i.end))));
        const range = maxF - minF;

        // Render axis ticks every 25 years
        const axis = document.getElementById("tl-axis");
        const startYear = Math.floor(minF / 25) * 25;
        const endYear = Math.ceil(maxF / 25) * 25;
        for (let y = startYear; y <= endYear; y += 25) {
          if (y < minF - 1 || y > maxF + 1) continue;
          const tick = document.createElement("div");
          tick.className = "tl-axis__tick";
          const left = ((y - minF) / range) * 100;
          tick.style.left = left + "%";
          tick.innerHTML = "<span>" + y + "</span>";
          axis.appendChild(tick);
        }

        // Render bars on track
        const track = document.getElementById("tl-track");
        const today = new Date();
        const currentFloat = today.getFullYear() + today.getMonth() / 12;
        items.forEach((item) => {
          const sF = dateToFloat(parseDate(item.start));
          const eF = dateToFloat(parseDate(item.end));
          const left = ((sF - minF) / range) * 100;
          const width = ((eF - sF) / range) * 100;

          const bar = document.createElement("div");
          bar.className = "tl-bar";
          if (eF >= currentFloat - 10) bar.classList.add("is-current");
          bar.style.left = left + "%";
          bar.style.width = width + "%";
          bar.textContent = item.summary;
          bar.title = `${item.summary} (${formatDate(item.start)} – ${formatDate(item.end)})`;
          bar.setAttribute("role", "listitem");
          track.appendChild(bar);
        });

        // Render list cards
        const list = document.getElementById("tl-list");
        items.forEach((item) => {
          const sF = dateToFloat(parseDate(item.start));
          const eF = dateToFloat(parseDate(item.end));
          const dur = durationYears(parseDate(item.start), parseDate(item.end));
          const li = document.createElement("article");
          li.className = "tl-item";
          if (eF >= currentFloat - 10) li.classList.add("is-current");
          li.innerHTML = `
            <p class="tl-item__period"></p>
            <h3 class="tl-item__name"></h3>
            <p class="tl-item__duration"></p>
          `;
          li.querySelector(".tl-item__period").textContent = `${formatDate(item.start)} 〜 ${formatDate(item.end)}`;
          li.querySelector(".tl-item__name").textContent = item.summary;
          li.querySelector(".tl-item__duration").textContent = fmtDuration(dur);
          list.appendChild(li);
        });
      }

      init().catch((e) => {
        document.getElementById("tl-list").innerHTML =
          '<p class="ds-error">データの読み込みに失敗しました: ' + (e && e.message ? e.message : e) + "</p>";
      });
    </script>
  </body>
</html>
